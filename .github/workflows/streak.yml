name: Update Streak Stats SVG

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Streak Stats SVG
        uses: denvercoder1/github-readme-streak-stats@main
        with:
          username: ${{ github.repository_owner }}
          path: streak-stats.svg
          # Injeta os argumentos diretamente na execução do binário PHP da action
          args: --theme=tokyonight
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Commit and Push to Repository Root
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak-stats.svg
          git commit -m "Streak Stats - tokyonight" || exit 0
          git push
