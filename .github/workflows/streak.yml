name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *" # Executa todo dia às 03:00
  push:
    paths:
      - ".github/workflows/streak.yml" # Mude para streak.yml se for o nome atual do seu arquivo
  workflow_dispatch: # Permite rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          # MUDADO PARA O SEU USUÁRIO, TEMA TOKYONIGHT E ANIMAÇÕES DESATIVADAS
          options: user=${{ github.repository_owner }}&theme=tokyonight&disable_animations=false
          # MUDADO PARA A RAIZ DO REPOSITÓRIO
          path: streak-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak-stats.svg
          git commit -m "Update streak stats" || exit 0
          git push
