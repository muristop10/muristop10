name: Update Streak Stats SVG

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Streak Stats SVG
        uses: denvercoder1/github-readme-streak-stats@main
        with:
          username: ${{ github.repository_owner }}
          theme: tokyonight
          output: streak-stats.svg
          path: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add streak-stats.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update streak stats SVG" && git push)
