<svg width="1200" height="110" viewBox="0 0 1200 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgFooter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b0a5e"/>
      <stop offset="55%" stop-color="#151f4a"/>
      <stop offset="100%" stop-color="#05060d"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="1200" height="110" fill="url(#bgFooter)"/>

  <!-- grade de pontos, cantos, mesmo padrao do header -->
  <g fill="#ffffff" opacity="0.08">
    <circle cx="55" cy="24" r="1.5"/><circle cx="90" cy="24" r="1.5"/><circle cx="125" cy="24" r="1.5"/>
    <circle cx="55" cy="86" r="1.5"/><circle cx="90" cy="86" r="1.5"/><circle cx="125" cy="86" r="1.5"/>
    <circle cx="1075" cy="24" r="1.5"/><circle cx="1110" cy="24" r="1.5"/><circle cx="1145" cy="24" r="1.5"/>
    <circle cx="1075" cy="86" r="1.5"/><circle cx="1110" cy="86" r="1.5"/><circle cx="1145" cy="86" r="1.5"/>
  </g>

  <!-- simbolos de codigo espalhados, bem discretos -->
  <g font-family="Consolas, 'Courier New', monospace" font-weight="700" fill="#ffffff">
    <text x="70"  y="65" font-size="18" opacity="0.07">&lt;/&gt;</text>
    <text x="220" y="30" font-size="14" opacity="0.06">( )</text>
    <text x="960" y="30" font-size="14" opacity="0.06">( )</text>
    <text x="1110" y="65" font-size="18" opacity="0.07">&lt;/&gt;</text>
    <text x="320" y="85" font-size="12" opacity="0.05">( )</text>
    <text x="860" y="85" font-size="12" opacity="0.05">&lt;/&gt;</text>
  </g>

  <!-- estrelinhas discretas, toque de "encerramento" -->
  <g fill="#ffffff">
    <circle cx="180" cy="55" r="1.4" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.08;0.35" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="60" r="1.4" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.06;0.3" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="35" r="1.1" opacity="0.28">
      <animate attributeName="opacity" values="0.28;0.05;0.28" dur="3.8s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="40" r="1.1" opacity="0.25">
      <animate attributeName="opacity" values="0.25;0.05;0.25" dur="3s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- linha decorativa -->
  <rect x="555" y="38" width="90" height="3" rx="1.5" fill="#ffffff" opacity="0.55"/>

  <!-- tag de fechamento, assinatura -->
  <g font-family="Consolas, 'Courier New', monospace" font-weight="700" text-anchor="middle">
    <text x="600" y="72" font-size="26" fill="#c9d3ff" opacity="0.85">&lt;/Murilo&gt;</text>
  </g>
  <rect x="682" y="52" width="6" height="20" fill="#ffffff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0;0.6" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
