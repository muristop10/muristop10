<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6a11cb"/>
      <stop offset="100%" stop-color="#2575fc"/>
    </linearGradient>
    <linearGradient id="termHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fundo -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- grade de pontos sutil -->
  <g fill="#ffffff" opacity="0.08">
    <circle cx="60" cy="40" r="1.6"/><circle cx="100" cy="40" r="1.6"/><circle cx="140" cy="40" r="1.6"/>
    <circle cx="60" cy="80" r="1.6"/><circle cx="100" cy="80" r="1.6"/><circle cx="140" cy="80" r="1.6"/>
  </g>

  <!-- simbolos de codigo espalhados, baixa transparencia -->
  <g font-family="Consolas, 'Courier New', monospace" font-weight="700" fill="#ffffff">
    <text x="30"  y="150" font-size="26" opacity="0.10">&lt;/&gt;</text>
    <text x="410" y="45"  font-size="20" opacity="0.09">( )</text>
    <text x="430" y="270" font-size="24" opacity="0.11">&lt;/&gt;</text>
    <text x="620" y="235" font-size="18" opacity="0.08">( )</text>
    <text x="900" y="270" font-size="22" opacity="0.10">( )</text>
    <text x="770" y="60"  font-size="24" opacity="0.10">&lt;/&gt;</text>
    <text x="1160" y="150" font-size="20" opacity="0.09">( )</text>
    <text x="990" y="185" font-size="16" opacity="0.08">&lt;/&gt;</text>
    <text x="20"  y="260" font-size="18" opacity="0.08">( )</text>
    <text x="1000" y="30" font-size="16" opacity="0.08">( )</text>
    <text x="20" y="200" font-size="16" opacity="0.07">&lt;/&gt;</text>
    <text x="560" y="40" font-size="16" opacity="0.07">&lt;/&gt;</text>
  </g>

  <!-- janela de terminal -->
  <g transform="translate(60,95)">
    <rect x="0" y="0" width="330" height="120" rx="10" fill="#0d1117" opacity="0.55"/>
    <rect x="0" y="0" width="330" height="24" rx="10" fill="url(#termHeader)"/>
    <circle cx="16" cy="12" r="4.5" fill="#ff5f56"/>
    <circle cx="32" cy="12" r="4.5" fill="#ffbd2e"/>
    <circle cx="48" cy="12" r="4.5" fill="#27c93f"/>
    <text x="16" y="46" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7ee787">const <tspan fill="#79c0ff">dev</tspan> = {</text>
    <text x="32" y="66" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#c9d1d9">nome: <tspan fill="#a5d6ff">"Murilo Thomé"</tspan>,</text>
    <text x="32" y="86" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#c9d1d9">stack: <tspan fill="#a5d6ff">"full-stack web"</tspan>,</text>
    <text x="32" y="106" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#c9d1d9">mindset: <tspan fill="#a5d6ff">"sempre aprendendo"</tspan></text>
    <text x="16" y="126" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7ee787">}</text>
    <rect x="234" y="112" width="8" height="14" fill="#ffffff" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0;0.7" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- texto principal (sem subtitulo) -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="470" y="165" font-size="56" font-weight="800" fill="#ffffff">Murilo Thomé</text>
  </g>

  <!-- linha decorativa -->
  <rect x="472" y="182" width="90" height="4" rx="2" fill="#ffffff" opacity="0.85"/>

  <!-- bloco estilo voxel (verde/terra), parte superior, levemente angulado -->
  <g transform="translate(760,58) rotate(-14)">
    <polygon points="0,-30 26,-15 0,0 -26,-15" fill="#6fbf3e"/>
    <polygon points="-26,-15 0,0 0,26 -26,11" fill="#4f8f2b"/>
    <polygon points="26,-15 0,0 0,26 26,11" fill="#8a5a2b"/>
    <polygon points="26,-15 0,0 0,26 26,11" fill="#7a4e24" opacity="0.5"/>
    <g fill="#ffffff" opacity="0.14">
      <rect x="-16" y="-20" width="4" height="4"/>
      <rect x="4" y="-24" width="4" height="4"/>
      <rect x="-6" y="-12" width="4" height="4"/>
    </g>
  </g>

  <!-- icone de headset (gaming), parte inferior, levemente angulado -->
  <g transform="translate(700,242) rotate(11)" opacity="0.95">
    <path d="M -30,4 Q -30,-30 0,-30 Q 30,-30 30,4" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
    <rect x="-38" y="0" width="16" height="24" rx="7" fill="#ffffff" opacity="0.88"/>
    <rect x="22" y="0" width="16" height="24" rx="7" fill="#ffffff" opacity="0.88"/>
    <path d="M -30,20 Q -22,34 -4,32" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <circle cx="-4" cy="32" r="3.4" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- coracao de pixel, toque final -->
  <g transform="translate(1080,238) scale(1.1)" opacity="0.16" fill="#ffffff">
    <rect x="-8" y="-6" width="4" height="4"/><rect x="-4" y="-10" width="4" height="4"/>
    <rect x="0" y="-6" width="4" height="4"/><rect x="4" y="-10" width="4" height="4"/>
    <rect x="8" y="-6" width="4" height="4"/><rect x="-4" y="-2" width="4" height="4"/>
    <rect x="0" y="-2" width="4" height="4"/><rect x="4" y="-2" width="4" height="4"/>
    <rect x="0" y="2" width="4" height="4"/>
  </g>
</svg>
